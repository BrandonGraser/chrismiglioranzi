<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chris Miglioranzi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <canvas id="matrix-rain"></canvas>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
        <filter id="matrix-motion" x="-10%" y="-10%" width="120%" height="120%">
            <!-- x=0, y=0.6: blur only along the vertical fall direction -->
            <feGaussianBlur stdDeviation="0 0.6" />
        </filter>
    </svg>

    <nav class="site-nav blur-fade" aria-label="Primary navigation">
        <a href="/contact.html">Contact</a>
    </nav>

    <section class="hero">
        <h1 class="name blur-fade"><span class="name-first" data-edit="nameFirst">Chris</span> <span class="name-last" data-edit="nameLast">Miglioranzi</span></h1>

        <div class="stats blur-fade">
            <div class="stat">
                <div class="stat-number" data-edit="stat1Value" data-stat>100B+</div>
                <div class="stat-label" data-edit="stat1Label">Views Generated</div>
            </div>
            <div class="stat">
                <div class="stat-number" data-edit="stat2Value" data-stat>200+</div>
                <div class="stat-label" data-edit="stat2Label">Brands Voiced</div>
            </div>
            <div class="stat">
                <div class="stat-number" data-edit="stat3Value" data-stat>$50M+</div>
                <div class="stat-label" data-edit="stat3Label">Revenue Driven</div>
            </div>
        </div>

        <div class="blur-fade">
            <a href="mailto:chris@respectivecollective.com" class="shimmer-button"><span data-edit="email">chris@respectivecollective.com</span></a>
        </div>
    </section>

    <script src="/matrix.js"></script>
    <script src="/content.js"></script>
    <script src="/site.js"></script>
</body>
</html>
